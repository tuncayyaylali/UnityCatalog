apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-lakehouse-realm
  namespace: lakehouse
  labels:
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/component: identity-realm
data:
  lakehouse-realm.json: |
    {
      "realm": "lakehouse",
      "enabled": true,
      "displayName": "Lakehouse Data Platform",
      "sslRequired": "none",
      "registrationAllowed": false,
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Platform Administrator"
          },
          {
            "name": "data-engineer",
            "description": "Data Engineer with read and write access across lakehouse layers"
          },
          {
            "name": "data-analyst",
            "description": "Data Analyst with read access restricted to Gold layer"
          }
        ]
      },
      "clients": [
        {
          "clientId": "trino",
          "name": "Trino SQL Engine",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "trino-client-secret-12345",
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "protocolMappers": [
            {
              "name": "audience-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "trino",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            },
            {
              "name": "groups-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "minio",
          "name": "MinIO Object Storage",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "minio-client-secret-12345",
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "publicClient": false,
          "protocol": "openid-connect",
          "protocolMappers": [
            {
              "name": "policy-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-hardcoded-claim-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "policy",
                "claim.value": "consoleAdmin",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@lakehouse.local",
          "firstName": "Platform",
          "lastName": "Admin",
          "credentials": [
            {
              "type": "password",
              "value": "Admin@123",
              "temporary": false
            }
          ],
          "realmRoles": ["admin"]
        },
        {
          "username": "engineer",
          "enabled": true,
          "email": "engineer@lakehouse.local",
          "firstName": "Data",
          "lastName": "Engineer",
          "credentials": [
            {
              "type": "password",
              "value": "Engineer@123",
              "temporary": false
            }
          ],
          "realmRoles": ["data-engineer"]
        },
        {
          "username": "analyst",
          "enabled": true,
          "email": "analyst@lakehouse.local",
          "firstName": "Data",
          "lastName": "Analyst",
          "credentials": [
            {
              "type": "password",
              "value": "Analyst@123",
              "temporary": false
            }
          ],
          "realmRoles": ["data-analyst"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.5
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres.lakehouse.svc.cluster.local:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "postgres"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_URL
              value: "http://localhost:8081"
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms512m -Xmx1024m"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          volumeMounts:
            - name: realm-volume
              mountPath: /opt/keycloak/data/import/lakehouse-realm.json
              subPath: lakehouse-realm.json
      volumes:
        - name: realm-volume
          configMap:
            name: keycloak-lakehouse-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: lakehouse
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: keycloak

