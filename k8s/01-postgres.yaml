apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: lakehouse
  labels:
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/component: metadata-and-operational-db
type: Opaque
stringData:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgrespassword
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: lakehouse
  labels:
    app.kubernetes.io/part-of: lakehouse
data:
  init.sql: |
    CREATE DATABASE keycloak;
    CREATE DATABASE unity_catalog;
    CREATE DATABASE operasyonel_db;

    \c operasyonel_db;

    CREATE TABLE IF NOT EXISTS public.users (
        user_id VARCHAR(50) PRIMARY KEY,
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        email VARCHAR(150),
        status VARCHAR(20) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO public.users (user_id, first_name, last_name, email, status) VALUES
    ('usr_001', 'Ahmet', 'Yilmaz', 'ahmet.yilmaz@example.com', 'ACTIVE'),
    ('usr_002', 'Ayse', 'Demir', 'ayse.demir@example.com', 'ACTIVE'),
    ('usr_003', 'Mehmet', 'Kaya', 'mehmet.kaya@example.com', 'ACTIVE'),
    ('usr_004', 'Fatma', 'Celik', 'fatma.celik@example.com', 'INACTIVE'),
    ('usr_005', 'Can', 'Ozturk', 'can.ozturk@example.com', 'ACTIVE')
    ON CONFLICT (user_id) DO NOTHING;

    CREATE TABLE IF NOT EXISTS public.salaries (
        emp_id VARCHAR(10) PRIMARY KEY,
        employee_name VARCHAR(100) NOT NULL,
        department VARCHAR(50) NOT NULL,
        base_salary NUMERIC(10, 2) NOT NULL
    );

    INSERT INTO public.salaries (emp_id, employee_name, department, base_salary) VALUES
    ('EMP001', 'Caner Yilmaz', 'Engineering', 95000.00),
    ('EMP002', 'Elif Demir', 'Product', 88000.00),
    ('EMP003', 'Murat Kaya', 'Data Science', 92000.00),
    ('EMP004', 'Zeynep Celik', 'Security', 90000.00),
    ('EMP005', 'Ahmet Ozturk', 'Operations', 75000.00)
    ON CONFLICT (emp_id) DO NOTHING;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: lakehouse
  labels:
    app.kubernetes.io/part-of: lakehouse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: lakehouse
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-keycloak
  namespace: lakehouse
  labels:
    app.kubernetes.io/name: postgres-keycloak
    app.kubernetes.io/part-of: lakehouse
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres

